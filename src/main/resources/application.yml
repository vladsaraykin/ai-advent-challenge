spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 0
  application:
    name: ai-advent-challenge
  ai:
    mcp:
      client:
        enabled: ${MCP_ENABLED:true}
        initialized: true
        name: ai-advent-mcp-client
        version: 1.0.0
        type: SYNC
        request-timeout: ${MCP_REQUEST_TIMEOUT:20s}
        toolcallback:
          enabled: false
        stdio:
          connections:
            filesystem:
              command: ${MCP_FILESYSTEM_COMMAND:node}
              args:
                - ${MCP_FILESYSTEM_ENTRYPOINT:mcp/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js}
                - ${MCP_FILESYSTEM_ROOT:.}
            excel:
              command: ${MCP_EXCEL_COMMAND:uv}
              args:
                - --directory
                - ${MCP_EXCEL_DIRECTORY:../excel-mcp}
                - run
                - --frozen
                - --no-sync
                - excel-mcp
        streamable-http:
          connections:
            expenses:
              url: ${MCP_EXPENSES_URL:http://127.0.0.1:8090}
              endpoint: ${MCP_EXPENSES_ENDPOINT:/mcp}
    openai:
      api-key: ${OPENAI_API_KEY:missing-api-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}

app:
  rag:
    reranker:
      base-url: ${RAG_RERANKER_URL:http://127.0.0.1:18090}
      timeout-seconds: ${RAG_RERANKER_TIMEOUT_SECONDS:60}
      candidate-k: ${RAG_CANDIDATE_K:20}
      final-k: ${RAG_FINAL_K:5}
      threshold: ${RAG_RERANKER_THRESHOLD:0.2}
    answer:
      # API ID confirmed by the user. Standard short-context rates from supplied pricing page.
      model: ${RAG_ANSWER_MODEL:gpt-6.1-sol}
      max-completion-tokens: ${RAG_ANSWER_MAX_TOKENS:4096}
      timeout-seconds: ${RAG_ANSWER_TIMEOUT_SECONDS:180}
      top-k: ${RAG_TOP_K:5}
      max-context-tokens: ${RAG_CONTEXT_TOKENS:6000}
      input-per-million-usd: ${RAG_INPUT_PRICE:2.00}
      cached-input-per-million-usd: ${RAG_CACHED_INPUT_PRICE:0.10}
      output-per-million-usd: ${RAG_OUTPUT_PRICE:10.00}
    enabled: ${RAG_ENABLED:true}
    chunking:
      max-estimated-tokens: ${RAG_CHUNK_MAX_ESTIMATED_TOKENS:384}
      overlap-estimated-tokens: ${RAG_CHUNK_OVERLAP_ESTIMATED_TOKENS:64}
    database:
      url: ${RAG_DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/ai_advent_rag}
      username: ${RAG_DATABASE_USERNAME:ai_advent_rag}
      password: ${RAG_DATABASE_PASSWORD:}
      maximum-pool-size: ${RAG_DATABASE_POOL_SIZE:3}
      connection-timeout: 5s
    ollama:
      base-url: ${RAG_OLLAMA_BASE_URL:http://127.0.0.1:11435}
      model: ${RAG_EMBEDDING_MODEL:embeddinggemma}
      dimensions: 768
      connect-timeout: 5s
      request-timeout: 120s
  reports:
    directory: ${REPORTS_DIRECTORY:../share/reports}
  agents:
    location: ${AGENT_CONFIG_LOCATION:classpath:agents/*.yaml}
  openai:
    proxy:
      enabled: ${OPENAI_PROXY_ENABLED:false}
      host: ${OPENAI_PROXY_HOST:127.0.0.1}
      port: ${OPENAI_PROXY_PORT:10809}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId} chatId=%X{chatId}]"
  level:
    org.apache.pdfbox: "OFF"
    org.apache.poi: "OFF"
    io.modelcontextprotocol.client.transport.StdioClientTransport: WARN
